services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: priority_task_manager
    ports:
      - "5432:5432"
    volumes:
      - ptm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: PriorityTaskManager.API/Dockerfile
    ports:
      - "5299:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=priority_task_manager;Username=postgres;Password=postgres"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in a .env file or the environment (a real secret, not a dev default) before running docker compose}"
      Jwt__Issuer: "PriorityTaskManager"
      Jwt__Audience: "PriorityTaskManagerClients"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ptm-postgres-data:
